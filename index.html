<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kendra's Tasty Pastries — Order Form</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playball&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --cream: #fbf3ea;
    --card: #ffffff;
    --pink: #cf5c7f;
    --pink-soft: #f3d9de;
    --pink-pale: #f8e9ec;
    --brown: #4a3327;
    --brown-soft: #8a7364;
    --gold: #c9a06a;
    --line: #e9d9d0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(207,92,127,0.06), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(201,160,106,0.08), transparent 55%),
      var(--cream);
    color:var(--brown);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 60px;
  }

  header{
    text-align:center;
    padding:40px 20px 24px;
  }
  header img.logo{
    width:150px;
    height:auto;
    border-radius:50%;
    box-shadow:0 6px 18px rgba(74,51,39,0.12);
  }
  header p.tagline{
    margin:14px 0 0;
    color:var(--brown-soft);
    font-size:13.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:600;
  }
  header .divider{
    width:180px;
    margin:18px auto 0;
    opacity:0.9;
  }

  .layout{
    max-width:1100px;
    margin:0 auto;
    padding:20px 20px 0;
    display:grid;
    grid-template-columns:1.55fr 1fr;
    gap:30px;
    align-items:start;
  }
  @media(max-width:860px){
    .layout{grid-template-columns:1fr;}
  }

  .menu-col{display:flex;flex-direction:column;gap:26px;}

  .category{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 26px 12px;
    box-shadow:0 4px 16px rgba(74,51,39,0.05);
  }
  .category h2{
    font-family:'Playball',cursive;
    font-weight:400;
    font-size:34px;
    color:var(--pink);
    margin:0 0 6px;
    text-align:center;
  }
  .category .squiggle{
    display:block;
    width:130px;
    margin:0 auto 16px;
    opacity:0.85;
  }

  .item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    padding:11px 0;
    border-bottom:1px dotted var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item-info{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;}
  .heart{color:var(--pink);font-size:12px;flex-shrink:0;}
  .item-text{min-width:0;}
  .item-name{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-weight:600;
    font-size:15.5px;
    color:var(--brown);
    line-height:1.35;
  }
  .item-sub{
    font-size:11.5px;
    color:var(--brown-soft);
    margin-top:1px;
  }
  .item-price{
    font-family:'Playfair Display',serif;
    font-weight:700;
    color:var(--pink);
    font-size:15px;
    flex-shrink:0;
  }

  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    border:1px solid var(--pink-soft);
    background:var(--pink-pale);
    border-radius:20px;
    overflow:hidden;
    flex-shrink:0;
  }
  .stepper button{
    background:transparent;
    border:none;
    color:var(--pink);
    width:28px;height:28px;
    font-size:16px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:background 0.15s;
  }
  .stepper button:hover{background:rgba(207,92,127,0.15);}
  .stepper span{
    min-width:22px;
    text-align:center;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--brown);
  }

  /* Order ticket */
  .ticket-wrap{position:sticky;top:20px;}
  .ticket{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px;
    box-shadow:0 8px 24px rgba(74,51,39,0.08);
  }

  .ticket h3{
    font-family:'Playball',cursive;
    font-weight:400;
    font-size:30px;
    text-align:center;
    margin:0 0 4px;
    color:var(--pink);
  }
  .ticket .sub-h{
    text-align:center;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--brown-soft);
    margin-bottom:16px;
  }

  .ticket .empty{
    color:var(--brown-soft);
    font-size:13px;
    text-align:center;
    padding:14px 0;
    font-style:italic;
  }

  .ticket-line{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--brown-soft);
    padding:4px 0;
  }
  .ticket-line span:last-child{color:var(--brown);font-weight:600;}

  .ticket hr{
    border:none;
    border-top:1px dotted var(--line);
    margin:12px 0;
  }

  .ticket-total{
    display:flex;
    justify-content:space-between;
    font-size:19px;
    font-weight:700;
    color:var(--pink);
    padding-top:2px;
    font-family:'Playfair Display',serif;
  }

  form .field{margin-bottom:14px;}
  form label{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--brown-soft);
    margin-bottom:6px;
  }
  form input[type=text], form input[type=tel], form input[type=datetime-local]{
    width:100%;
    background:var(--pink-pale);
    border:1px solid var(--pink-soft);
    color:var(--brown);
    padding:9px 10px;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  form input:focus{outline:2px solid var(--pink);outline-offset:1px;}

  .radio-row{display:flex;gap:10px;flex-wrap:wrap;}
  .radio-pill{
    flex:1;
    min-width:120px;
    border:1px solid var(--pink-soft);
    background:var(--pink-pale);
    border-radius:20px;
    padding:9px 10px;
    font-size:13px;
    text-align:center;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    color:var(--brown-soft);
    transition:all 0.15s;
  }
  .radio-pill input{display:none;}
  .radio-pill.active{
    border-color:var(--pink);
    color:var(--pink);
    background:#fff;
    font-weight:600;
    box-shadow:0 2px 8px rgba(207,92,127,0.18);
  }

  .submit-btn{
    width:100%;
    background:var(--pink);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:24px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    margin-top:8px;
    letter-spacing:0.3px;
    box-shadow:0 6px 16px rgba(207,92,127,0.28);
  }
  .submit-btn:hover{background:#b94d6f;}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .error-msg{
    color:var(--pink);
    font-size:12px;
    margin-top:-6px;
    margin-bottom:10px;
    display:none;
  }

  .confirmation{
    display:none;
    text-align:center;
    padding:10px 0 4px;
  }
  .confirmation .stamp{
    display:inline-block;
    color:var(--pink);
    font-family:'Playball',cursive;
    font-weight:400;
    font-size:28px;
    margin-bottom:10px;
  }
  .confirmation p{font-size:12.5px;color:var(--brown-soft);line-height:1.6;}
  .confirmation .mailto-btn{
    display:inline-block;
    margin-top:10px;
    color:var(--pink);
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
  }

  .group-btn{
    display:block;
    width:100%;
    background:var(--pink-pale);
    border:1px dashed var(--pink);
    color:var(--pink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:18px;
  }
  .group-btn:hover{background:var(--pink-soft);}

  .group-banner{
    background:var(--pink-pale);
    border:1px solid var(--pink-soft);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:18px;
    text-align:center;
  }
  .group-banner-label{
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--brown-soft);
    margin-bottom:4px;
  }
  .group-code{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:20px;
    color:var(--pink);
    letter-spacing:2px;
    margin-bottom:10px;
  }
  .copy-link-btn{
    background:#fff;
    border:1px solid var(--pink);
    color:var(--pink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:7px 14px;
    border-radius:16px;
    cursor:pointer;
  }
  .copy-link-btn:hover{background:var(--pink-soft);}
  .copy-link-btn.copied{background:var(--pink);color:#fff;}

  .join-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 16px;
    margin-bottom:18px;
    text-align:center;
  }
  .join-panel p{
    font-size:13px;
    color:var(--brown-soft);
    margin:0 0 10px;
  }
  .join-panel input{
    width:100%;
    background:var(--pink-pale);
    border:1px solid var(--pink-soft);
    color:var(--brown);
    padding:9px 10px;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    margin-bottom:10px;
  }

  .participant-heading{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--pink);
    margin:12px 0 2px;
  }
  .participant-heading:first-child{margin-top:0;}
</style>
</head>

function allItems(){

// ---- Group Order state ----
let groupMode = false;
let groupId = null;
let myKey = null;
let myName = null;
let groupData = null;
let groupSubmitted = false;

function isLocked(){ return groupMode && groupSubmitted; }

function getMyParticipantId(){
  let id = localStorage.getItem('bakeryParticipantId');
  if(!id){
    id = 'p' + Math.random().toString(36).slice(2,10);
    localStorage.setItem('bakeryParticipantId', id);
  }
  return id;
}
function makeGroupCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i=0;i<5;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}
function getGroupUrl(id){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('group', id);
  return url.toString();
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

menuCol.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-id]');
  if(!btn || isLocked()) return;
  const id = btn.dataset.id;
  let newQty = qty[id];
  if(btn.dataset.action === 'inc') newQty++;
  else newQty = Math.max(0, newQty - 1);

  if(groupMode && groupDb && myKey){
    groupDb.ref(`groups/${groupId}/participants/${myKey}/items/${id}`).set(newQty);
    groupDb.ref(`groups/${groupId}/participants/${myKey}/name`).set(myName);
    qty[id] = newQty;
    document.getElementById('qty-'+id).textContent = newQty;
  } else {
    qty[id] = newQty;
    document.getElementById('qty-'+id).textContent = newQty;
    renderTicket();
  }
});

const paymentRadios = document.querySelectorAll('input[name=payment]');
const fulfillmentRadios = document.querySelectorAll('input[name=fulfillment]');

function wirePills(radios, pillIds, groupField){
  radios.forEach(r => r.addEventListener('change', () => {
    if(isLocked()) return;
    pillIds.forEach(pid => document.getElementById(pid).classList.remove('active'));
    const activeId = r.closest('.radio-pill').id;
    document.getElementById(activeId).classList.add('active');
    if(groupMode && groupDb){
      groupDb.ref(`groups/${groupId}/${groupField}`).set(r.value);
    } else {
      renderTicket();
    }
  }));
}
wirePills(paymentRadios, ['pillCash','pillVenmo'], 'payment');
wirePills(fulfillmentRadios, ['pillPickup','pillDropoff'], 'fulfillment');

['custTime','custName','custPhone','custEmail'].forEach(fieldId => {
  const fieldMap = { custTime: 'pickupTime', custName: 'contactName', custPhone: 'contactPhone', custEmail: 'contactEmail' };
  document.getElementById(fieldId).addEventListener('input', (e) => {
    if(groupMode && groupDb && !isLocked()){
      groupDb.ref(`groups/${groupId}/${fieldMap[fieldId]}`).set(e.target.value);
    }
  });
});

function getPayment(){
  return document.querySelector('input[name=payment]:checked').value;
}

function renderTicket(){
  return groupMode ? renderGroupTicket() : renderSoloTicket();
}

function renderSoloTicket(){
  const ticketItems = document.getElementById('ticketItems');
  const items = allItems().filter(i => qty[i.id] > 0);
  let subtotal = 0;

  if(items.length === 0){
    ticketItems.innerHTML = '<div class="empty">Nothing in your order yet — tap + on any item.</div>';
    document.getElementById('hr1').style.display = 'none';
  } else {
    document.getElementById('hr1').style.display = 'block';
    ticketItems.innerHTML = items.map(i => {
      const lineTotal = i.price * qty[i.id];
      subtotal += lineTotal;
      return `<div class="ticket-line"><span>${qty[i.id]}× ${i.name}</span><span>$${lineTotal.toFixed(2)}</span></div>`;
    }).join('');
  }

  const venmoFee = getPayment() === 'Venmo' ? 2 : 0;
  document.getElementById('feeLine').style.display = venmoFee ? 'flex' : 'none';
  const total = subtotal + venmoFee;
  document.getElementById('totalDisplay').textContent = '$' + total.toFixed(2);

  return { items, subtotal, venmoFee, total };
}

function renderGroupTicket(){
  const ticketItems = document.getElementById('ticketItems');
  if(!groupData){
    ticketItems.innerHTML = '<div class="empty">Loading group order…</div>';
    return { subtotal: 0, venmoFee: 0, total: 0, participants: {} };
  }

  const participants = groupData.participants || {};
  const itemsById = {};
  allItems().forEach(i => itemsById[i.id] = i);

  let html = '';
  let grandSubtotal = 0;
  let anyItems = false;

  Object.keys(participants).forEach(pk => {
    const p = participants[pk];
    const pItems = p.items || {};
    const lines = Object.keys(pItems).filter(id => pItems[id] > 0 && itemsById[id]);
    if(lines.length === 0) return;
    anyItems = true;
    html += `<div class="participant-heading">${escapeHtml(p.name || 'Someone')}</div>`;
    lines.forEach(id => {
      const item = itemsById[id];
      const q = pItems[id];
      const lineTotal = item.price * q;
      grandSubtotal += lineTotal;
      html += `<div class="ticket-line"><span>${q}× ${item.name}</span><span>$${lineTotal.toFixed(2)}</span></div>`;
    });
  });

  if(!anyItems){
    ticketItems.innerHTML = '<div class="empty">No items yet — share the invite link so others can add their own!</div>';
    document.getElementById('hr1').style.display = 'none';
  } else {
    ticketItems.innerHTML = html;
    document.getElementById('hr1').style.display = 'block';
  }

  const payment = groupData.payment || 'Cash';
  const venmoFee = payment === 'Venmo' ? 2 : 0;
  document.getElementById('feeLine').style.display = venmoFee ? 'flex' : 'none';
  const total = grandSubtotal + venmoFee;
  document.getElementById('totalDisplay').textContent = '$' + total.toFixed(2);

  const myItems = (participants[myKey] && participants[myKey].items) || {};
  allItems().forEach(i => {
    const el = document.getElementById('qty-'+i.id);
    if(el) el.textContent = myItems[i.id] || 0;
  });

  syncSharedFieldsToForm();

  return { subtotal: grandSubtotal, venmoFee, total, participants };
}

function syncSharedFieldsToForm(){
  if(!groupData) return;
  const timeEl = document.getElementById('custTime');
  if(document.activeElement !== timeEl) timeEl.value = groupData.pickupTime || '';

  const nameEl = document.getElementById('custName');
  if(document.activeElement !== nameEl) nameEl.value = groupData.contactName || '';

  const phoneEl = document.getElementById('custPhone');
  if(document.activeElement !== phoneEl) phoneEl.value = groupData.contactPhone || '';

  const emailEl = document.getElementById('custEmail');
  if(document.activeElement !== emailEl) emailEl.value = groupData.contactEmail || '';

  const payment = groupData.payment || 'Cash';
  document.querySelectorAll('input[name=payment]').forEach(r => r.checked = (r.value === payment));
  document.getElementById('pillCash').classList.toggle('active', payment === 'Cash');
  document.getElementById('pillVenmo').classList.toggle('active', payment === 'Venmo');

  const fulfillment = groupData.fulfillment || 'Pickup';
  document.querySelectorAll('input[name=fulfillment]').forEach(r => r.checked = (r.value === fulfillment));
  document.getElementById('pillPickup').classList.toggle('active', fulfillment === 'Pickup');
  document.getElementById('pillDropoff').classList.toggle('active', fulfillment === 'Dropoff');
}

// ---- Group Order flow ----
function startGroupOrder(){
  if(!groupDb){
    alert("Group Order needs a one-time free setup by the bakery owner first (a shared order database). Ask them to finish connecting it.");
    return;
  }
  groupId = makeGroupCode();
  groupDb.ref('groups/'+groupId).set({
    createdAt: Date.now(),
    fulfillment: 'Pickup',
    pickupTime: '',
    contactName: '',
    contactPhone: '',
    payment: 'Cash',
    submitted: false,
    participants: {}
  });
  const url = new URL(window.location.href);
  url.searchParams.set('group', groupId);
  window.history.replaceState({}, '', url);
  enterGroupMode(groupId);
}

function enterGroupMode(id){
  groupMode = true;
  groupId = id;
  myKey = getMyParticipantId();
  document.getElementById('startGroupBtn').style.display = 'none';

  const savedName = localStorage.getItem('bakeryName_'+id);
  if(savedName){
    myName = savedName;
    showGroupBanner();
    attachGroupListener();
  } else {
    document.getElementById('joinPanel').style.display = 'block';
  }
}

function showGroupBanner(){
  document.getElementById('groupBanner').style.display = 'block';
  document.getElementById('groupCodeDisplay').textContent = groupId;
  document.getElementById('joinPanel').style.display = 'none';
  document.getElementById('ticketTitle').textContent = 'Group Order';
  document.getElementById('custNameLabel').textContent = 'Group contact name';
  document.getElementById('custPhoneLabel').textContent = 'Contact phone (for pickup)';
  document.getElementById('submitBtn').textContent = 'Place Group Order';
}

function attachGroupListener(){
  groupDb.ref('groups/'+groupId).on('value', snapshot => {
    groupData = snapshot.val();
    if(!groupData) return;
    if(groupData.submitted && !groupSubmitted){
      groupSubmitted = true;
      showGroupConfirmation();
    }
    renderGroupTicket();
  });
}

function showGroupConfirmation(){
  document.getElementById('orderForm').style.display = 'none';
  document.getElementById('startGroupBtn').style.display = 'none';
  const confirmation = document.getElementById('confirmation');
  confirmation.style.display = 'block';
  document.getElementById('confirmText').textContent =
    `This group order has been placed! No further items can be added — thanks for ordering together.`;
  document.getElementById('mailtoBtn').style.display = 'none';
}

document.getElementById('startGroupBtn').addEventListener('click', startGroupOrder);

document.getElementById('joinBtn').addEventListener('click', () => {
  const nameInput = document.getElementById('joinNameInput');
  const name = nameInput.value.trim();
  if(!name){ nameInput.focus(); return; }
  myName = name;
  localStorage.setItem('bakeryName_'+groupId, name);
  groupDb.ref(`groups/${groupId}/participants/${myKey}/name`).set(name);
  showGroupBanner();
  attachGroupListener();
});

document.getElementById('copyLinkBtn').addEventListener('click', () => {
  const url = getGroupUrl(groupId);
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copyLinkBtn');
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 2000);
  });
});

(function initGroupFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const gid = params.get('group');
  if(!gid) return;
  if(!groupDb){
    const jp = document.getElementById('joinPanel');
    jp.style.display = 'block';
    jp.innerHTML = "<p>This group order link isn't active yet — ask the bakery to finish setting up group ordering.</p>";
    document.getElementById('startGroupBtn').style.display = 'none';
    return;
  }
  enterGroupMode(gid);
})();

renderTicket();

// ---- Submission ----
const form = document.getElementById('orderForm');
const errorMsg = document.getElementById('errorMsg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if(groupMode){ await submitGroupOrder(); return; }

  const { items, subtotal, venmoFee, total } = renderTicket();

  if(items.length === 0){
    errorMsg.textContent = "Add at least one item before placing your order.";
    errorMsg.style.display = 'block';
    return;
  }
  errorMsg.style.display = 'none';

  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const email = document.getElementById('custEmail').value.trim();
  const time = document.getElementById('custTime').value;
  const fulfillment = document.querySelector('input[name=fulfillment]:checked').value;
  const payment = getPayment();

  const orderLines = items.map(i => `${qty[i.id]}× ${i.name} — $${(i.price*qty[i.id]).toFixed(2)}`).join('\n');
  const summary = `New order from ${name}
Phone: ${phone}
${fulfillment} requested for: ${time ? new Date(time).toLocaleString() : "(not set)"}
Payment: ${payment}${venmoFee ? " (+$2 fee)" : ""}

Items:
${orderLines}

Subtotal: $${subtotal.toFixed(2)}
${venmoFee ? "Venmo fee: $2.00\n" : ""}Total due: $${total.toFixed(2)}`;

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = "Placing order...";

  let notified = false;
  if(WEB3FORMS_ACCESS_KEY !== "YOUR_ACCESS_KEY"){
    try{
      const payload = {
        access_key: WEB3FORMS_ACCESS_KEY,
        subject: `New bakery order from ${name} — $${total.toFixed(2)}`,
        name,
        phone,
        email: email || "not provided",
        fulfillment,
        requested_time: time ? new Date(time).toLocaleString() : "(not set)",
        payment,
        total: "$" + total.toFixed(2),
        order_details: summary
      };
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      notified = res.ok && result.success;
      if(!notified) console.error("Web3Forms responded with an error:", result);
    }catch(err){
      console.error("Web3Forms notification failed:", err);
    }
  }

  form.style.display = 'none';
  const confirmation = document.getElementById('confirmation');
  confirmation.style.display = 'block';
  document.getElementById('confirmText').textContent = notified
    ? `Thanks, ${name}! We've noted your order — total due is $${total.toFixed(2)} (${payment}). We'll see you at ${time ? new Date(time).toLocaleString() : "the requested time"}.`
    : `Thanks, ${name}! Your order total is $${total.toFixed(2)} (${payment}). We couldn't confirm the automatic notification went through, so please tap the button below to email it to us directly.`;

  const mailBody = encodeURIComponent(summary);
  document.getElementById('mailtoBtn').onclick = () => {
    window.location.href = `mailto:${OWNER_EMAIL}?subject=${encodeURIComponent("New bakery order from " + name)}&body=${mailBody}`;
  };
});

async function submitGroupOrder(){
  if(!groupData){
    errorMsg.textContent = "Still loading the group order — please wait a moment and try again.";
    errorMsg.style.display = 'block';
    return;
  }

  const { subtotal, venmoFee, total, participants } = renderGroupTicket();
  const hasItems = participants && Object.values(participants).some(p => p.items && Object.values(p.items).some(q => q > 0));
  if(!hasItems){
    errorMsg.textContent = "No items have been added to this group order yet.";
    errorMsg.style.display = 'block';
    return;
  }

  const contactName = document.getElementById('custName').value.trim();
  const contactPhone = document.getElementById('custPhone').value.trim();
  const contactEmail = document.getElementById('custEmail').value.trim();
  const time = document.getElementById('custTime').value;
  const fulfillment = (groupData && groupData.fulfillment) || 'Pickup';
  const payment = (groupData && groupData.payment) || 'Cash';

  if(!contactName || !contactPhone || !time){
    errorMsg.textContent = "Please fill in the group contact name, phone, and pickup time before placing the order.";
    errorMsg.style.display = 'block';
    return;
  }
  errorMsg.style.display = 'none';

  const submitBtn = document.getElementById('submitBtn');

  try{
    const itemsById = {};
    allItems().forEach(i => itemsById[i.id] = i);

    let breakdown = '';
    Object.keys(participants).forEach(pk => {
      const p = participants[pk];
      const lines = Object.keys(p.items || {}).filter(id => p.items[id] > 0 && itemsById[id]);
      if(lines.length === 0) return;
      breakdown += `\n${p.name || 'Someone'}:\n`;
      lines.forEach(id => {
        const item = itemsById[id];
        const q = p.items[id];
        breakdown += `  ${q}× ${item.name} — $${(item.price*q).toFixed(2)}\n`;
      });
    });

    const summary = `New GROUP order — code ${groupId}
Group contact: ${contactName}
Phone: ${contactPhone}
${fulfillment} requested for: ${time ? new Date(time).toLocaleString() : "(not set)"}
Payment: ${payment}${venmoFee ? " (+$2 fee)" : ""}
${breakdown}
Subtotal: $${subtotal.toFixed(2)}
${venmoFee ? "Venmo fee: $2.00\n" : ""}Total due: $${total.toFixed(2)}`;

    submitBtn.disabled = true;
    submitBtn.textContent = "Placing group order...";

    let notified = false;
    if(WEB3FORMS_ACCESS_KEY !== "YOUR_ACCESS_KEY"){
      try{
        const payload = {
          access_key: WEB3FORMS_ACCESS_KEY,
          subject: `New GROUP bakery order (${groupId}) from ${contactName} — $${total.toFixed(2)}`,
          name: contactName,
          group_code: groupId,
          contact_name: contactName,
          phone: contactPhone,
          email: contactEmail || "not provided",
          fulfillment,
          requested_time: time ? new Date(time).toLocaleString() : "(not set)",
          payment,
          total: "$" + total.toFixed(2),
          order_details: summary
        };
        const res = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        notified = res.ok && result.success;
        if(!notified) console.error("Web3Forms responded with an error:", result);
      }catch(err){
        console.error("Web3Forms notification failed:", err);
      }
    }

    await groupDb.ref(`groups/${groupId}/submitted`).set(true);

    if(!notified){
      const mailBody = encodeURIComponent(summary);
      const mailtoBtn = document.getElementById('mailtoBtn');
      mailtoBtn.style.display = 'inline-block';
      mailtoBtn.onclick = () => {
        window.location.href = `mailto:${OWNER_EMAIL}?subject=${encodeURIComponent("New GROUP bakery order " + groupId)}&body=${mailBody}`;
      };
    }
  }catch(err){
    console.error("Group order submission failed:", err);
    errorMsg.textContent = "Something went wrong placing the order — please try again.";
    errorMsg.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = "Place Group Order";
  }
}
</script>

</body>
</html>
